# IncuBrix Lead Engine settings.
# Every value here comes from docs/BRIEF.pdf unless DECISIONS.md says otherwise.
# Secrets never go here: they live in .env (see .env.example).

# Database (engine.db) and logs (logs/) are written inside the --out folder.

http:
  retries: 3                  # brief: retry 3 times, then log and skip the row
  backoff_seconds: 2          # base wait between retries (doubles each attempt)
  timeout_seconds: 20

cache:
  search_max_age_days: 7      # discovery searches are reused for a week, so a weekly rerun finds new creators
  enrich_max_age_days: 7      # profiles, uploads, feeds and pages: a weekly rerun sees fresh activity
  failure_max_age_days: 1     # a feed or website that failed is not retried for a day (APIs are always retried)

enrich:
  recent_days: 60             # item details (duration, captions) are kept for this window: the longest activity rule
  youtube_uploads: 50         # last N uploads read per channel (1 playlistItems call)
  rss_episodes: 50            # last N episodes read per feed
  item_text_chars: 2000       # description kept per item (sponsor and need evidence lives here)
  website_pages: [contact, about]   # besides the homepage, follow the first same-site link containing each word
  website_text_chars: 20000   # page text kept per page
  max_links: 200              # links kept per creator
  # Never fetched: big platforms whose terms forbid scraping, and sites that are not the creator's own.
  # Their links are still recorded (e.g. an Instagram handle is a contact option).
  skip_domains: [youtube.com, youtu.be, instagram.com, facebook.com, x.com, twitter.com, tiktok.com,
                 linkedin.com, apple.com, spotify.com, amazon.com, google.com, threads.net, linktr.ee,
                 patreon.com, discord.gg, discord.com, t.me, wa.me]

discover:
  youtube_max_results: 50     # per search.list call (API maximum); each call costs 100 quota units
  podcastindex_max_results: 100
  itunes_limit: 50            # per store per term
  itunes_stores: [US]         # 2026-10-27 test: all 7 approved-country stores returned the same 38 shows (DECISIONS.md)
  itunes_pause_seconds: 3     # Apple allows roughly 20 calls a minute; only applied to uncached calls

segments:                     # approved segments, spelled exactly as the Submission Workbook dropdown
  - Podcaster/Video Podcaster
  - YouTuber/Video-First Creator
  - Expert-Led Creator

discovery_platforms: [youtube, podcast]  # the only sources the brief provides APIs for

countries:
  approved: [US, CA, GB, IE, AU, NZ, SG]  # ISO 3166 codes as in the workbook; the brief's "UK" is GB
  min_approved_share: 0.80    # at least 80% of final leads from approved countries
  min_countries: 3            # at least 3 distinct countries
  max_country_share: 0.60     # no single country above 60%

language:
  required: en                # mainly English content

activity:
  recent_items: 8             # 8+ items ...
  recent_days: 30             # ... in 30 days
  long_form_items: 2          # or 2+ long-form items ...
  long_form_days: 60          # ... in 60 days
  long_form_min_minutes: 20   # decision 2026-10-28, see DECISIONS.md

reachable:
  channel_active_days: 60     # contact channel must show activity in the last 60 days

verify:
  english_min_share: 0.6      # "mainly English": at least 60% of recent items detected as English
  short_max_seconds: 180      # YouTube Shorts are at most 3 minutes
  caption_gap_min_items: 3    # "no captions" needs at least this many recent items to be a fair claim
  repurpose_min_long_items: 2 # "long-form but no Shorts/clips" needs at least this many long items
  consistency_gap_days: 21    # a gap this long between recent uploads is a consistency signal
  quote_chars: 160            # evidence quotes are cut to this length around the match

evidence:
  max_age_days: 30            # evidence must be checked within 30 days; --refresh re-checks older

priority_a:
  count: 25                   # top 25 by score are Priority A
  follow_ups: 2               # Priority A gets a first message + 2 follow-ups

targets:
  min_leads: 1000

# scoring weights: added in Phase 3 and explained in docs/DECISIONS.md

sender:                       # used by draft (Phase 4); must not claim to be IncuBrix staff (assignment section 8)
  name: Logeshwaran
  description: final year IT student at TCE
  postal_address: "{sender_postal_address}"  # CAN-SPAM needs a real postal address in commercial email;
                                             # left as a placeholder for IncuBrix to fill at launch (DECISIONS.md)

llm:
  provider: gemini            # Google Gemini API (AI Studio key in .env as LLM_API_KEY); access checked 2026-10-27
  # model: chosen in Phase 4 from the models the key can use

segments:                     # approved segments, spelled exactly as the Submission Workbook dropdown
  - Podcaster/Video Podcaster
  - YouTuber/Video-First Creator
  - Expert-Led Creator

discovery_platforms: [youtube, podcast, podcast_category, apple_chart]  # podcast_category: Podcast Index category names; apple_chart: Apple genre names

countries:
  approved: [US, CA, GB, IE, AU, NZ, SG]  # ISO 3166 codes as in the workbook; the brief's "UK" is GB
  min_approved_share: 0.80    # at least 80% of final leads from approved countries
  min_countries: 3            # at least 3 distinct countries
  max_country_share: 0.60     # no single country above 60%

language:
  required: en                # mainly English content

activity:
  recent_items: 8             # 8+ items ...
  recent_days: 30             # ... in 30 days
  long_form_items: 2          # or 2+ long-form items ...
  long_form_days: 60          # ... in 60 days
  long_form_min_minutes: 20   # decision 2026-10-28, see DECISIONS.md

reachable:
  channel_active_days: 60     # contact channel must show activity in the last 60 days

verify:
  english_min_share: 0.6      # "mainly English": at least 60% of recent items detected as English
  short_max_seconds: 180      # YouTube Shorts are at most 3 minutes
  caption_gap_min_items: 3    # "no captions" needs at least this many recent items to be a fair claim
  repurpose_min_long_items: 2 # "long-form but no Shorts/clips" needs at least this many long items
  consistency_gap_days: 21    # a gap this long between recent uploads is a consistency signal
  quote_chars: 160            # evidence quotes are cut to this length around the match
  # Podcasts have no public audience count, so their size comes from the creator's linked YouTube
  # channel. 250,000: the owner's choice on 2026-10-28, the most common upper band in their YouTube seeds.
  podcast_max_youtube_subscribers: 250000
  # A show whose website or contact email is on one of these domains is a broadcaster's or network's
  # programme, not a creator's. Hosting platforms (Libsyn, Spreaker, Art19) are not on this list.
  media_domains: [
    iheart.com, audacy.com, siriusxm.com, pandora.com, npr.org, bbc.co.uk, bbc.com, global.com, lbc.co.uk,
    globalplayer.com, voxmedia.com, wondery.com, espn.com, cnn.com, foxnews.com, nbcnews.com, cbsnews.com,
    abc.net.au, cbc.ca, rte.ie, rnz.co.nz, nytimes.com, lockedonpodcasts.com, bleav.com, 247sports.com,
    theathletic.com, theringer.com, cumulusmedia.com, salemmedia.com, earwolf.com,
  ]

dedupe:
  # Website domains many creators share, so they never mark two rows as one creator.
  # Added to enrich.skip_domains, verify.media_domains and the hosting domains in engine/verify.py.
  shared_domains: [substack.com, blogspot.com, podcast.show, riverside.com, beehiiv.com, kajabi.com,
                   mykajabi.com, teachable.com, thinkific.com, gumroad.com, wixsite.com, weebly.com,
                   poddyhost.com, prx.org, zencastr.com, inlet.fm, podigee.io, jellypod.com, podpage.com,
                   ausha.co, libsynpro.com, bit.ly, yahoo.com]
  # An email listed as the contact of this many different shows (across all verified rows) belongs to a
  # network or a re-upload feed, not the creator: the row is rejected. Two shows sharing an email are
  # treated as one creator and merged instead (measured 2026-10-28: 2,168 emails on 1 show, 110 on 2).
  shared_email_min_shows: 3

evidence:
  max_age_days: 30            # evidence must be checked within 30 days; --refresh re-checks older

priority_a:
  count: 25                   # top 25 by score are Priority A
  follow_ups: 2               # Priority A gets a first message + 2 follow-ups

targets:
  min_leads: 1000

score:                        # owner's choice 2026-10-28 ("Balanced"); reasons in docs/DECISIONS.md
  need:                       # 30: by need_kind from verify; the creator's own words beat an observed gap
    own words: 30
    repurposing: 22           # long episodes with no clips or video: IncuBrix's core job
    captions: 15              # episodes without transcripts
    consistency: 12           # irregular gaps between uploads
  volume:                     # 20: long-form items in the last 60 days
    max: 20
    full_at: 8                # 8 long items in 60 days (weekly) earns the full 20; fewer earn a share
  commercial:                 # 20: by monetization_signal from verify
    Sponsorship: 20           # already earns from content and has sponsors to report reach to
    Service: 16
    Course: 16
    Product: 16
    Membership: 12
    Affiliate: 8
  reach:                      # 20
    email: 12                 # a published email
    form_or_pitch: 4          # a contact form or podcast guest-pitch page
    second_channel: 4         # at least 2 kinds of channel, so route has a backup
  evidence:                   # 10: strength of the country evidence
    strong: 10                # platform country, feed tag, a sentence or an address
    domain_only: 6            # only the website's country domain
  priority_b_min_score: 50    # outside the top 25 (Priority A): 50+ is B, below is C

draft:                        # message wording; templates are in engine/draft.py
  # What IncuBrix does, worded only from the assignment's own need list (editing, captions,
  # repurposing). No product claims beyond that: the owner can change this line.
  pitch: "IncuBrix helps creators with editing, captions and repurposing, so one long recording can also become a transcript, short clips and posts."
  call_to_action: "Would a 15-minute chat be worth it, to see whether it fits how you work today?"
  follow_up_offer: "If a call is too much, a one-line reply on how you handle this today would already help."
  follow_up_days: [4, 9]      # Priority A: follow-up 1 on day 4 (same channel), follow-up 2 on day 9 (backup channel)
  title_chars: 70             # recent item titles are shortened to this in emails and forms
  dm_title_chars: 40          # and to this in social messages
  max_chars:                  # length check per channel
    default: 1500             # email, contact form, guest-pitch page
    LinkedIn: 300             # LinkedIn's limit for a connection-request note
    Instagram: 1000
    X: 1000
    TikTok: 1000

sender:                       # used by draft (Phase 4); must not claim to be IncuBrix staff (assignment section 8)
  name: Logeshwaran
  description: final year IT student at TCE
  postal_address: "{sender_postal_address}"  # CAN-SPAM needs a real postal address in commercial email;
                                             # left as a placeholder for IncuBrix to fill at launch (DECISIONS.md)

llm:
  provider: gemini            # Google Gemini API (AI Studio key in .env as LLM_API_KEY); access checked 2026-10-27
  # Free tier. Model quality changes engine quality: a stronger model classifies and writes better,
  # but costs more or is rate-limited. Swap here; see DECISIONS.md (2026-10-28) for the test results.
  model: gemini-3.5-flash-lite
  fallback_models: [gemini-3.1-flash-lite, gemini-3.5-flash, gemini-3.8-flash]  # each has its own free daily quota; asked in order when the one before runs out (429) or is busy (5xx)
  # Groq free tier (GROQ_API_KEY), asked after the Gemini models, in order. Each model has its own daily
  # token cap (gpt-oss-120b: 200,000 tokens in a rolling 24 h, about 115 checks).
  groq_models: [openai/gpt-oss-120b, openai/gpt-oss-20b, qwen/qwen3.8-27b]
  groq_pause_seconds: 14       # Groq free tier allows 8,000 tokens a minute; one check is about 1,700 tokens
  rate_limit_wait_seconds: 60  # after a 429: wait once and retry (per-minute limit) before calling the quota spent
  groq_reasoning_effort: low   # gpt-oss only: same answer in the 2026-10-29 probe, 1,705 tokens instead of 2,447
  timeout_seconds: 60         # LLM answers are slower than API lookups
  pause_seconds: 4            # after each uncached Gemini call: about 15 a minute, inside the free tier (1 s is enough on a billed key)
  cache_days: 30              # same prompt, same answer: reuse it as long as evidence stays valid
  max_input_chars: 6000       # text sent per creator (description + website), to keep prompts small

seed_test:                    # seedtest.py (Phase 6): owner's own test accounts only (.env SEED_*)
  minutes_per_day: 2          # one sequence day = 2 minutes, so day-4 and day-9 follow-ups arrive the same evening
